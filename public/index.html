<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    
    <!-- Viewport optimizado para iPad -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Tema color para navegador -->
    <meta name="theme-color" content="#059669" />
    
    <!-- Información para Apple (iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOLES" />
    
    <!-- Apple Touch Icon (iPad app) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23059669' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='100' font-family='Arial' fill='white' text-anchor='middle' dominant-baseline='middle'>🌱</text></svg>" />
    
    <!-- Descripción -->
    <meta name="description" content="MOLES Jardinería - Sistema integral de gestión para empresas de jardinería y piscinas. Optimizado 100% para iPad Pro." />
    <meta name="keywords" content="moles, jardineria, gestion, empresa, ipad, sistema" />
    <meta name="author" content="MOLES Jardinería" />
    
    <!-- Open Graph (para redes sociales) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MOLES Jardinería - Sistema de Gestión" />
    <meta property="og:description" content="Sistema integral de gestión para empresas de jardinería y piscinas" />
    <meta property="og:image" content="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630'><rect fill='%23059669' width='1200' height='630'/><text x='50%' y='50%' font-size='128' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>MOLES 🌱</text></svg>" />
    
    <!-- Startup screens iPad -->
    <link rel="apple-touch-startup-image" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1366'><rect fill='%23ffffff' width='1024' height='1366'/><text x='50%' y='683' font-size='200' font-family='Arial' fill='%23059669' text-anchor='middle' dominant-baseline='middle'>🌱</text></svg>" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='70' font-size='80' text-anchor='middle'>🌱</text></svg>" />
    
    <!-- Estilos globales para iPad -->
    <style>
      * {
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      
      input, textarea, select, button {
        -webkit-user-select: text;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #ffffff;
        overscroll-behavior: none;
      }
      
      /* Prevenir scroll bounce en iPad */
      html, body {
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      
      #root {
        height: 100vh;
        width: 100vw;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      
      /* Optimización de botones para iPad */
      button, a {
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        padding: 12px 16px;
        border-radius: 8px;
      }
      
      /* Safe Area en notch/Dynamic Island */
      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
      
      /* Evitar zoom accidental */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="tel"],
      textarea,
      select {
        font-size: 16px;
      }
      
      /* Teclado virtual optimizado */
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid #059669;
      }
    </style>
    
    <!-- Service Worker para PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js')
            .then(registration => {
              console.log('✅ Service Worker registrado');
            })
            .catch(error => {
              console.log('Service Worker error:', error);
            });
        });
      }
      
      // Detectar si es instalado como app
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('💾 App puede instalarse');
      });
      
      window.addEventListener('appinstalled', () => {
        console.log('✅ App instalada en iPad');
      });
    </script>
    
    <title>MOLES Jardinería</title>
  </head>
  
  <body>
    <noscript>Necesitas JavaScript habilitado para usar MOLES Jardinería.</noscript>
    
    <!-- Contenedor principal -->
    <div id="root"></div>
    
    <!-- Scripts React (auto-incluidos por Create React App) -->
  </body>
</html>
